services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      NODE_ENV: production
      BACKEND_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}
      AI_SERVICE_URL: http://ai-api:8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN is required for production}
      TRIAL_DURATION_DAYS: ${TRIAL_DURATION_DAYS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-auto}
      AI_EMBEDDINGS_ENABLED: ${AI_EMBEDDINGS_ENABLED:-false}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      SUMOPOD_MODE: ${SUMOPOD_MODE:-sandbox}
      SUMOPOD_PAYMENT_BASE_URL: ${SUMOPOD_PAYMENT_BASE_URL:-}
      SUMOPOD_PAYMENT_API_KEY: ${SUMOPOD_PAYMENT_API_KEY:-}
      SUMOPOD_WEBHOOK_SECRET: ${SUMOPOD_WEBHOOK_SECRET:-}
      SUMOPOD_WEBHOOK_TOKEN: ${SUMOPOD_WEBHOOK_TOKEN:-}
      PAYMENT_SUCCESS_RETURN_URL: ${PAYMENT_SUCCESS_RETURN_URL:-}
      PAYMENT_CANCEL_RETURN_URL: ${PAYMENT_CANCEL_RETURN_URL:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health | grep -qi 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ai-api:
    build:
      context: ./AI
    entrypoint: ["uvicorn", "http_api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${AI_DATABASE_URL:?AI_DATABASE_URL is required for production}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-auto}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDINGS_ENABLED: ${AI_EMBEDDINGS_ENABLED:-false}
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN is required for production}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/healthz | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
