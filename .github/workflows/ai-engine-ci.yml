name: AI Engine CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'AI/**'
      - '.github/workflows/ai-engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AI/**'

jobs:
  ai-engine:
    name: AI Engine Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run evaluation
        run: python evaluate.py || true
        continue-on-error: true
