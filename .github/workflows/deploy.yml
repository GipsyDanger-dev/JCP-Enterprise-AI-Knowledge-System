name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip integration tests'
        required: false
        default: false
        type: boolean

  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================
  # Pre-deployment checks
  # ============================================
  pre-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Backend checks
      - name: Backend - Install
        working-directory: backend
        run: npm ci

      - name: Backend - Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend - Build
        working-directory: backend
        run: npm run build

      # Frontend checks
      - name: Frontend - Install
        working-directory: frontend
        run: npm ci

      - name: Frontend - Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend - Build
        working-directory: frontend
        run: npm run build

      # AI Engine checks
      - name: AI Engine - Install
        working-directory: AI
        run: pip install -r requirements.txt

      - name: AI Engine - Tests
        working-directory: AI
        run: python -m unittest discover -s tests -v || true

  # ============================================
  # Build Docker images
  # ============================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: pre-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "backend_tag=${{ secrets.DOCKER_USERNAME }}/jcp-backend:${VERSION}" >> $GITHUB_OUTPUT
            echo "ai_tag=${{ secrets.DOCKER_USERNAME }}/jcp-ai-engine:${VERSION}" >> $GITHUB_OUTPUT
            echo "frontend_tag=${{ secrets.DOCKER_USERNAME }}/jcp-frontend:${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "backend_tag=${{ secrets.DOCKER_USERNAME }}/jcp-backend:staging" >> $GITHUB_OUTPUT
            echo "ai_tag=${{ secrets.DOCKER_USERNAME }}/jcp-ai-engine:staging" >> $GITHUB_OUTPUT
            echo "frontend_tag=${{ secrets.DOCKER_USERNAME }}/jcp-frontend:staging" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.backend_tag }}
            ${{ secrets.DOCKER_USERNAME }}/jcp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI engine
        uses: docker/build-push-action@v5
        with:
          context: ./AI
          push: true
          tags: |
            ${{ steps.tags.outputs.ai_tag }}
            ${{ secrets.DOCKER_USERNAME }}/jcp-ai-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend_tag }}
            ${{ secrets.DOCKER_USERNAME }}/jcp-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy to Staging
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/jcp-staging
            
            # Pull latest images
            docker compose pull
            
            # Run migrations
            docker compose run --rm backend npx prisma migrate deploy
            
            # Restart services
            docker compose up -d --force-recreate
            
            # Wait for health checks
            sleep 15
            
            # Verify health
            curl -f http://localhost:8000/health || exit 1
            curl -f http://localhost:8001/health || exit 1
            
            echo "✅ Staging deployment successful"

  # ============================================
  # Deploy to Production
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-images
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/jcp-production
            
            # Create backup
            echo "Creating database backup..."
            docker compose exec -T postgres pg_dump -U postgres > /backups/db-$(date +%Y%m%d-%H%M%S).sql || true
            
            # Pull latest images
            docker compose pull
            
            # Run migrations
            docker compose run --rm backend npx prisma migrate deploy
            
            # Restart services with zero downtime
            docker compose up -d --force-recreate --remove-orphans
            
            # Wait for health checks
            sleep 20
            
            # Verify health
            curl -f http://localhost:8000/health || exit 1
            curl -f http://localhost:8001/health || exit 1
            
            # Cleanup old images
            docker image prune -f
            
            echo "✅ Production deployment successful"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
