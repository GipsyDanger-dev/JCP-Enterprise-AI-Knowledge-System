name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy current main to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_KEY_B64: ${{ secrets.VPS_DEPLOY_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail

            cd /opt/jcp-production
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker compose -f docker-compose.prod.yml --env-file .env up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env exec -T backend npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml --env-file .env exec -T backend node -e "fetch('http://127.0.0.1:8000/health').then((response) => { if (!response.ok) process.exit(1) })"
            docker compose -f docker-compose.prod.yml --env-file .env exec -T ai-api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
          REMOTE
