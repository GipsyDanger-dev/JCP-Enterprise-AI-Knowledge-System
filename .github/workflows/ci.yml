name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================
  # Backend CI
  # ============================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # ============================================
  # Frontend CI
  # ============================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================
  # AI Engine CI
  # ============================================
  ai-engine-ci:
    name: AI Engine CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run evaluation
        run: python evaluate.py || true  # Soft fail for now

  # ============================================
  # Integration Tests
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, ai-engine-ci]
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      JWT_SECRET: test-jwt-secret-key-for-ci-only
      AI_SERVICE_URL: http://localhost:8001
      SUMOPOD_API_KEY: ${{ secrets.SUMOPOD_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed test database
        working-directory: backend
        run: |
          SEED_ADMIN_EMAIL=admin@test.com \
          SEED_ADMIN_PASSWORD=admin1234567 \
          SEED_USER_EMAIL=user@test.com \
          SEED_USER_PASSWORD=user1234567 \
          npm run prisma:seed

      - name: Start backend
        working-directory: backend
        run: |
          npm run start:dev &
          sleep 10
          curl -f http://localhost:8000/health || exit 1

      - name: Start AI engine
        working-directory: AI
        run: |
          pip install -r requirements.txt
          python -m uvicorn http_api:app --host 0.0.0.0 --port 8001 &
          sleep 5
          curl -f http://localhost:8001/health || exit 1

      - name: Run integration tests
        working-directory: backend
        run: |
          # Test login
          TOKEN=$(curl -s -X POST http://localhost:8000/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@test.com","password":"admin1234567"}' \
            | jq -r '.accessToken')
          
          # Test /auth/me
          curl -f http://localhost:8000/auth/me \
            -H "Authorization: Bearer $TOKEN"
          
          # Test /users
          curl -f http://localhost:8000/users \
            -H "Authorization: Bearer $TOKEN"
          
          # Test /documents
          curl -f http://localhost:8000/documents \
            -H "Authorization: Bearer $TOKEN"
          
          echo "✅ Integration tests passed"

  # ============================================
  # Docker Build
  # ============================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, ai-engine-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jcp-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/jcp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI engine
        uses: docker/build-push-action@v5
        with:
          context: ./AI
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jcp-ai-engine:latest
            ${{ secrets.DOCKER_USERNAME }}/jcp-ai-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jcp-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/jcp-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy to Production
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/jcp-production
            
            # Pull latest images
            docker compose pull
            
            # Restart services
            docker compose up -d --force-recreate
            
            # Wait for health checks
            sleep 10
            
            # Verify health
            curl -f http://localhost:8000/health || exit 1
            curl -f http://localhost:8001/health || exit 1
            
            echo "✅ Deployment successful"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployed to production"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"
