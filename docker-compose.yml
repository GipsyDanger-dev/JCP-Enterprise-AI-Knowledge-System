# Database dipakai dari Neon lewat DATABASE_URL, sama seperti
# docker-compose.prod.yml. Tidak ada PostgreSQL lokal di sini.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-jcp_enterprise_ai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build: ./backend
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    environment:
      # Dari compose postgres lokal (simulasi deploy); ganti ke DATABASE_URL bila
      # memakai database eksternal seperti Neon.
      DATABASE_URL: postgresql://${POSTGRES_USER:-jcp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jcp_enterprise_ai}?schema=public
      # Antar-container selalu memakai DNS service Docker, bukan localhost host.
      AI_SERVICE_URL: http://ai-api:8000
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      # Default false agar provider chat-only tetap dapat mengindeks dokumen
      # memakai TF-IDF lokal. Aktifkan hanya jika /v1/embeddings tersedia.
      AI_EMBEDDINGS_ENABLED: ${AI_EMBEDDINGS_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      WORKER_TOKEN: ${WORKER_TOKEN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      # Opsional: kosong berarti login Google tidak tersedia di backend.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      TSC_WATCHFILE: UsePolling
    ports:
      # Port di dalam container mengikuti BACKEND_PORT, jadi kedua sisi mapping
      # ikut berubah kalau nilainya diganti di .env.
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$BACKEND_PORT/health | grep -qi 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ai-api:
    build: ./AI
    image: jcp-ai-engine:local
    entrypoint: ["uvicorn", "http_api:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app
    volumes:
      - ./AI:/app
    environment:
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      # Provider harus kompatibel dengan format OpenAI /v1.
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-auto}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDINGS_ENABLED: ${AI_EMBEDDINGS_ENABLED:-false}
      # psycopg memakai koneksi internal Docker tanpa parameter khusus Prisma.
      DATABASE_URL: postgresql://${POSTGRES_USER:-jcp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jcp_enterprise_ai}
      # Shared secret yang sama dengan backend: AI service menolak semua request
      # (selain /health) yang tidak membawa header X-Worker-Token yang cocok.
      WORKER_TOKEN: ${WORKER_TOKEN}
    # Sengaja tanpa `ports`: AI service tidak boleh dijangkau dari host. Satu-satunya
    # jalur masuk adalah backend lewat jaringan internal Docker (http://ai-api:8000).
    # Untuk debugging manual: `docker compose exec ai-api ...`.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # python dipakai langsung karena image slim tidak punya curl/wget, dan host
      # sudah tidak bisa mengecek /health sendiri setelah port mapping dilepas.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      # Single origin: browser hanya melihat /api, vite dev server meneruskannya
      # ke backend lewat jaringan internal Docker.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      BACKEND_PROXY_URL: http://backend:8000
      # Opsional: kosong berarti tombol Google tidak dirender di frontend.
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      # Wajib untuk bind mount dari Windows/macOS: tanpa polling, Vite tidak
      # menerima event perubahan berkas dan terus menyajikan modul lama.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
  postgres_local_data:
