# Database dipakai dari Neon lewat DATABASE_URL, sama seperti
# docker-compose.prod.yml. Tidak ada PostgreSQL lokal di sini.
services:
  backend:
    build: ./backend
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Default ke service name Docker: tanpa `:-`, .env yang tidak memuat baris
      # AI_SERVICE_URL akan mengirim string kosong ke container.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-api:8000}
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      WORKER_TOKEN: ${WORKER_TOKEN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      TSC_WATCHFILE: UsePolling
    ports:
      # Port di dalam container mengikuti BACKEND_PORT, jadi kedua sisi mapping
      # ikut berubah kalau nilainya diganti di .env.
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$BACKEND_PORT/health | grep -qi 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ai-api:
    build: ./AI
    image: jcp-ai-engine:local
    entrypoint: ["uvicorn", "http_api:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app
    volumes:
      - ./AI:/app
      - ./backend/tmp:/app/tmp
    environment:
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      # Endpoint dan model provider ikut dari .env: tanpa ini container selalu
      # memakai default yang tertanam di AI/config.py, apa pun isi .env.
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-https://ai.sumopod.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-v4-pro}
      # Tetap memakai database yang sama, tetapi tanpa query parameter Prisma
      # `schema=public` yang tidak dikenali oleh psycopg/libpq.
      DATABASE_URL: ${AI_DATABASE_URL}
      # Shared secret yang sama dengan backend: AI service menolak semua request
      # (selain /health) yang tidak membawa header X-Worker-Token yang cocok.
      WORKER_TOKEN: ${WORKER_TOKEN}
    # Sengaja tanpa `ports`: AI service tidak boleh dijangkau dari host. Satu-satunya
    # jalur masuk adalah backend lewat jaringan internal Docker (http://ai-api:8000).
    # Untuk debugging manual: `docker compose exec ai-api ...`.
    expose:
      - "8000"
    healthcheck:
      # python dipakai langsung karena image slim tidak punya curl/wget, dan host
      # sudah tidak bisa mengecek /health sendiri setelah port mapping dilepas.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?VITE_GOOGLE_CLIENT_ID is required}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
